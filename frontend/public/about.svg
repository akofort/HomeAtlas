<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img"
     aria-label="Vom Netzwerk-Scan über die Erkennung zur fertigen Dokumentation"
     font-family="Segoe UI, system-ui, sans-serif">
  <!-- Illustration für die Über-Seite: was die App im Kern tut, in drei Schritten. Bewusst
       schematisch statt dekorativ; das Bild soll erklären, nicht schmücken. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" rx="16" fill="#0b1120"/>
  <path d="M120 150 H680" stroke="url(#flow)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- 1: Netz absuchen -->
  <g transform="translate(70,60)">
    <rect width="160" height="180" rx="14" fill="#131c31" stroke="#26304a"/>
    <circle cx="80" cy="62" r="26" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M99 81 L118 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="46" cy="40" r="4" fill="#34d399"/>
    <circle cx="112" cy="46" r="4" fill="#34d399"/>
    <circle cx="58" cy="88" r="4" fill="#34d399"/>
    <text x="80" y="132" text-anchor="middle" fill="#e8edf7" font-size="15" font-weight="600">1. Suchen</text>
    <text x="80" y="154" text-anchor="middle" fill="#94a3b8" font-size="12">Ping, Ports,</text>
    <text x="80" y="170" text-anchor="middle" fill="#94a3b8" font-size="12">mDNS, UPnP, Docker</text>
  </g>

  <!-- 2: Einordnen -->
  <g transform="translate(320,60)">
    <rect width="160" height="180" rx="14" fill="#131c31" stroke="#26304a"/>
    <rect x="44" y="34" width="72" height="20" rx="6" fill="#1b2540" stroke="#38bdf8" stroke-width="2"/>
    <rect x="44" y="62" width="72" height="20" rx="6" fill="#1b2540" stroke="#38bdf8" stroke-width="2"/>
    <rect x="44" y="90" width="72" height="20" rx="6" fill="#1b2540" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="49" text-anchor="middle" fill="#94a3b8" font-size="10">unbekannt</text>
    <text x="80" y="77" text-anchor="middle" fill="#94a3b8" font-size="10">Hersteller?</text>
    <text x="80" y="105" text-anchor="middle" fill="#e8edf7" font-size="10">Drucker</text>
    <text x="80" y="140" text-anchor="middle" fill="#e8edf7" font-size="15" font-weight="600">2. Einordnen</text>
    <text x="80" y="162" text-anchor="middle" fill="#94a3b8" font-size="12">Regeln + KI</text>
  </g>

  <!-- 3: Dokumentieren -->
  <g transform="translate(570,60)">
    <rect width="160" height="180" rx="14" fill="#131c31" stroke="#26304a"/>
    <rect x="40" y="30" width="80" height="100" rx="8" fill="#e8edf7"/>
    <path d="M52 50 H108 M52 64 H108 M52 78 H96 M52 92 H108 M52 106 H84"
          stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="112" cy="122" r="16" fill="#34d399"/>
    <path d="M105 122 l5 5 l9 -10" stroke="#0b1120" stroke-width="3.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="152" text-anchor="middle" fill="#e8edf7" font-size="15" font-weight="600">3. Dokumentieren</text>
    <text x="80" y="172" text-anchor="middle" fill="#94a3b8" font-size="12">verständlich, nach Themen</text>
  </g>
</svg>
